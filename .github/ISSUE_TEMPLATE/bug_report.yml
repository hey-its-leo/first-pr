
name: Report a problem
description: Report a problem with First PR.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check whether the issue already exists.
        Never include passwords, tokens, or private information.

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: Explain what happened.
      placeholder: Describe the issue here.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the problem.
    validations:
      required: false
